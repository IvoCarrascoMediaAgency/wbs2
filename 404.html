
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 - Página no encontrada | WhatsBulkSender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f7f9fc;
      text-align: center;
    }

    .container {
      max-width: 480px;
      padding: 40px 28px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 76px;
      color: #25d366;
    }

    h2 {
      margin: 12px 0;
      font-size: 25px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 16px;
      padding: 13px 24px;
      color: #fff;
      background: #25d366;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #1ebc59;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Hey!</h1>
    <h2>Gracias por usar WhatsBulkSender</h2>

    <p>
      Ahora serás redigirido a la pagina de servicio
    </p>

    <p>
      Redirigiendo en <strong id="countdown">3</strong> segundos...
    </p>

    <a class="button" href="/">
      Ir al Home
    </a>
  </main>

  <script>
    let seconds = 3;
    const countdown = document.getElementById("countdown");

    const timer = setInterval(() => {
      seconds--;
      countdown.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace("/");
      }
    }, 1000);
  </script>
</body>
</html>
